    <body>

        <div class="top_box">

            </div>

        <div class="filters">

                    <option value="price-desc">Price: High to Low</option>
                </select>
              </div>

              <label class="filter-label">Price Range (R)</label>
              <div >
                  <input type="range" min="100" max="200000" value="100" name="price" class="filter-range" id="price-slider">

            </div>

        </div>
